<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 36" width="100%" height="36">
  <defs>
    <pattern id="scanlines3" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.25" stroke-width="1.5" />
    </pattern>
  </defs>
  <style>
    .btn-bracket {
      fill: #38bdf8;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .btn-text {
      fill: #f0f6fc;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    svg:hover .btn-bracket {
      fill: #00f5ff;
      filter: drop-shadow(0 0 5px rgba(0, 245, 255, 0.9));
    }
    svg:hover .btn-text {
      fill: #38bdf8;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.9));
    }
    svg:hover rect.bg {
      fill: #131722;
    }
  </style>
  <!-- Background -->
  <rect class="bg" x="10" y="0" width="780" height="36" fill="#0d1117" />
  <rect x="10" y="0" width="780" height="36" fill="url(#scanlines3)" pointer-events="none" />
  <!-- Side Borders ONLY -->
  <line x1="10" y1="0" x2="10" y2="36" stroke="#30363d" stroke-width="1.2" />
  <line x1="790" y1="0" x2="790" y2="36" stroke="#30363d" stroke-width="1.2" />

  <text x="400" y="24" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Courier New', monospace" font-size="16" letter-spacing="1.5">
    <tspan class="btn-bracket">[ </tspan>
    <tspan class="btn-text">LinkedIn</tspan>
    <tspan class="btn-bracket"> ]</tspan>
  </text>
</svg>
