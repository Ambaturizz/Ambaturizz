<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="100%" height="270">
  <defs>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="48%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="cyan-bloom" cx="28%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16" />
      <stop offset="44%" stop-color="#0891b2" stop-opacity="0.045" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-bloom" cx="78%" cy="76%" r="62%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14" />
      <stop offset="54%" stop-color="#7c3aed" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="10" y1="10" x2="790" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="42%" stop-color="#334155" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="name-ink" x1="290" y1="0" x2="510" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="hud-stroke" x1="72" y1="0" x2="728" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="15%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </linearGradient>
    <pattern id="micro-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.038" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.08" />
    </pattern>
    <filter id="soft-glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ambient-blur" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    <clipPath id="panel-clip">
      <path d="M 10 26 L 10 270 L 790 270 L 790 26 Q 790 10 774 10 L 26 10 Q 10 10 10 26 Z" />
    </clipPath>
  </defs>

  <style>
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
    }
    .edge-pulse { animation: edgePulse 4.8s ease-in-out infinite alternate; }
    .status-dot { animation: statusPulse 1.8s ease-in-out infinite; transform-origin: 680px 30px; }
    .orbit-a { animation: orbitA 5.5s ease-in-out infinite alternate; }
    .orbit-b { animation: orbitB 6.5s ease-in-out infinite alternate-reverse; }
    .tagline { animation: taglineFloat 4.5s ease-in-out infinite alternate; }
    .caret { animation: caretBlink 0.8s steps(1, end) infinite; }
    @keyframes edgePulse {
      0% { opacity: 0.62; }
      100% { opacity: 1; filter: drop-shadow(0 0 3px rgba(34, 211, 238, 0.45)); }
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.48; transform: scale(0.86); }
      50% { opacity: 1; transform: scale(1.18); }
    }
    @keyframes orbitA { from { transform: translateX(-8px); opacity: 0.25; } to { transform: translateX(10px); opacity: 0.7; } }
    @keyframes orbitB { from { transform: translateX(8px); opacity: 0.2; } to { transform: translateX(-10px); opacity: 0.62; } }
    @keyframes taglineFloat { from { opacity: 0.68; } to { opacity: 1; } }
    @keyframes caretBlink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
  </style>

  <g clip-path="url(#panel-clip)">
    <path d="M 10 26 L 10 270 L 790 270 L 790 26 Q 790 10 774 10 L 26 10 Q 10 10 10 26 Z" fill="url(#panel-bg)" />
    <rect x="10" y="10" width="780" height="260" fill="url(#micro-grid)" />
    <ellipse cx="230" cy="102" rx="310" ry="190" fill="url(#cyan-bloom)" />
    <ellipse cx="624" cy="213" rx="280" ry="170" fill="url(#violet-bloom)" />
    <ellipse class="orbit-a" cx="198" cy="132" rx="122" ry="54" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="18" filter="url(#ambient-blur)" />
    <ellipse class="orbit-b" cx="610" cy="183" rx="138" ry="58" fill="none" stroke="#8b5cf6" stroke-opacity="0.07" stroke-width="20" filter="url(#ambient-blur)" />

    <path d="M 11 51 H 789" stroke="#334155" stroke-opacity="0.68" stroke-width="1" />
    <path d="M 28 68 V 245 M 772 68 V 245" stroke="#64748b" stroke-opacity="0.22" stroke-width="1" />
    <path d="M 28 82 H 44 M 28 82 V 66 M 772 82 H 756 M 772 82 V 66" fill="none" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.4" />
    <path d="M 28 228 H 44 M 28 228 V 244 M 772 228 H 756 M 772 228 V 244" fill="none" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.4" />

    <g aria-label="terminal controls">
      <circle cx="35" cy="30" r="5" fill="#ff5f57" />
      <circle cx="52" cy="30" r="5" fill="#febc2e" />
      <circle cx="69" cy="30" r="5" fill="#28c840" />
      <circle cx="35" cy="30" r="2" fill="#ffffff" fill-opacity="0.24" />
      <circle cx="52" cy="30" r="2" fill="#ffffff" fill-opacity="0.24" />
      <circle cx="69" cy="30" r="2" fill="#ffffff" fill-opacity="0.24" />
    </g>
    <text class="mono" x="90" y="34" fill="#94a3b8" font-size="11" letter-spacing="0.7">faris.salman@ui.ac.id:~ (bash)</text>

    <g>
      <rect x="662" y="20" width="105" height="20" rx="10" fill="#22d3ee" fill-opacity="0.075" stroke="#22d3ee" stroke-opacity="0.32" />
      <circle class="status-dot" cx="680" cy="30" r="3.2" fill="#22d3ee" filter="url(#soft-glow)" />
      <text class="mono" x="724" y="33.5" text-anchor="middle" fill="#67e8f9" font-size="9.5" font-weight="700" letter-spacing="0.9">SYS: ONLINE</text>
    </g>

    <path class="edge-pulse" d="M 72 78 H 286 L 298 66 H 502 L 514 78 H 728" fill="none" stroke="url(#hud-stroke)" stroke-width="1.5" />
    <circle cx="299" cy="66" r="2.6" fill="#22d3ee" fill-opacity="0.8" />
    <circle cx="501" cy="66" r="2.6" fill="#a78bfa" fill-opacity="0.8" />

    <text class="mono" x="400" y="116" text-anchor="middle" fill="url(#name-ink)" font-size="25" font-weight="750" letter-spacing="4.2" filter="url(#soft-glow)">FARIS SALMAN AZHARI</text>
    <path d="M 269 131 H 531" stroke="url(#hud-stroke)" stroke-width="1.2" opacity="0.78" />
    <circle cx="261" cy="131" r="2.2" fill="#22d3ee" opacity="0.8" />
    <circle cx="539" cy="131" r="2.2" fill="#a78bfa" opacity="0.8" />

    <g>
      <rect x="210" y="142" width="380" height="26" rx="13" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.2" />
      <text class="mono" x="400" y="160" text-anchor="middle" fill="#7dd3fc" font-size="15.5" font-weight="550" letter-spacing="0.65">Computer Science 2025 @ Universitas Indonesia</text>
    </g>

    <text class="mono" x="400" y="199" text-anchor="middle" font-size="16" font-weight="450" letter-spacing="0.45">
      <tspan fill="#e2e8f0">Developer</tspan>
      <tspan fill="#22d3ee" font-weight="bold"> &#8226; </tspan>
      <tspan fill="#e2e8f0">Product Builder</tspan>
      <tspan fill="#a78bfa" font-weight="bold"> &#8226; </tspan>
      <tspan fill="#e2e8f0">Larper</tspan>
    </text>

    <path d="M 123 212 H 677" stroke="#64748b" stroke-opacity="0.16" stroke-width="1" />
    <g class="tagline">
      <text class="mono" x="400" y="237" text-anchor="middle" fill="#94a3b8" font-size="14.5" letter-spacing="0.45">Building things (usually the useless ones)</text>
    </g>
    <rect class="caret" x="589" y="224" width="7" height="16" rx="1" fill="#22d3ee" filter="url(#soft-glow)" />

    <path d="M 54 252 H 222" stroke="#22d3ee" stroke-opacity="0.18" />
    <path d="M 578 252 H 746" stroke="#8b5cf6" stroke-opacity="0.18" />
    <circle cx="230" cy="252" r="2" fill="#22d3ee" opacity="0.45" />
    <circle cx="570" cy="252" r="2" fill="#a78bfa" opacity="0.45" />
  </g>

  <path d="M 10 270 L 10 26 Q 10 10 26 10 L 774 10 Q 790 10 790 26 L 790 270" fill="none" stroke="url(#edge)" stroke-width="1.35" />
</svg>
