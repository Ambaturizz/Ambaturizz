<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 65" width="100%" height="65">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="52%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="b-edge" x1="10" y1="0" x2="790" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.82" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="b-hud" x1="72" y1="0" x2="728" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="18%" stop-color="#22d3ee" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.25" />
      <stop offset="82%" stop-color="#a78bfa" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="b-bloom" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="b-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.035" stroke-width="0.8" />
    </pattern>
    <filter id="b-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="b-clip">
      <path d="M 10 0 L 10 39 Q 10 55 26 55 L 774 55 Q 790 55 790 39 L 790 0 Z" />
    </clipPath>
  </defs>
  <style>
    .b-pulse { animation: bPulse 4.2s ease-in-out infinite alternate; }
    .b-core { animation: bCore 2.1s ease-in-out infinite; transform-origin: 400px 25px; }
    @keyframes bPulse { from { opacity: 0.48; } to { opacity: 1; } }
    @keyframes bCore { 0%, 100% { opacity: 0.55; transform: scale(0.88) rotate(45deg); } 50% { opacity: 1; transform: scale(1.12) rotate(45deg); } }
  </style>
  <g clip-path="url(#b-clip)">
    <path d="M 10 0 L 10 39 Q 10 55 26 55 L 774 55 Q 790 55 790 39 L 790 0 Z" fill="url(#b-bg)" />
    <rect x="10" y="0" width="780" height="55" fill="url(#b-grid)" />
    <ellipse cx="400" cy="1" rx="320" ry="70" fill="url(#b-bloom)" />

    <path class="b-pulse" d="M 72 15 H 278 L 290 25 H 378 M 422 25 H 510 L 522 15 H 728" fill="none" stroke="url(#b-hud)" stroke-width="1.5" />
    <circle cx="72" cy="15" r="2.2" fill="#22d3ee" opacity="0.62" />
    <circle cx="728" cy="15" r="2.2" fill="#a78bfa" opacity="0.62" />
    <path d="M 386 25 H 414" stroke="#64748b" stroke-opacity="0.55" />
    <rect class="b-core" x="396" y="21" width="8" height="8" fill="none" stroke="#67e8f9" stroke-width="1.3" filter="url(#b-glow)" />

    <path d="M 28 10 V 36 Q 28 39 31 39 H 54" fill="none" stroke="#22d3ee" stroke-opacity="0.35" />
    <path d="M 772 10 V 36 Q 772 39 769 39 H 746" fill="none" stroke="#a78bfa" stroke-opacity="0.35" />
    <path d="M 52 44 H 244 M 556 44 H 748" stroke="#64748b" stroke-opacity="0.15" />
  </g>
  <path d="M 10 0 L 10 39 Q 10 55 26 55 L 774 55 Q 790 55 790 39 L 790 0" fill="none" stroke="url(#b-edge)" stroke-width="1.35" />
</svg>
