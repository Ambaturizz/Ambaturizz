<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 65" width="100%" height="65">
  <defs>
    <pattern id="scanlines4" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.25" stroke-width="1.5" />
    </pattern>
  </defs>
  <style>
    .hud-frame {
      animation: framePulse 4s ease-in-out infinite alternate;
    }
    @keyframes framePulse {
      0% { opacity: 0.82; stroke: #e6edf3; }
      100% { opacity: 1; stroke: #58a6ff; filter: drop-shadow(0 0 3px rgba(88, 166, 255, 0.4)); }
    }
  </style>

  <!-- Background Fill (Bottom Rounded, Open Top) -->
  <path d="M 10 0 L 10 39 Q 10 55 26 55 L 774 55 Q 790 55 790 39 L 790 0 Z" 
        fill="#0d1117" />
  <path d="M 10 0 L 10 39 Q 10 55 26 55 L 774 55 Q 790 55 790 39 L 790 0 Z" 
        fill="url(#scanlines4)" />

  <!-- Seamless Border (Left, Bottom, Right ONLY) -->
  <path d="M 10 0 L 10 39 Q 10 55 26 55 L 774 55 Q 790 55 790 39 L 790 0" 
        fill="none" stroke="#30363d" stroke-width="1.2" />

  <!-- Open-sided Cyber HUD Bottom Frame -->
  <path class="hud-frame" d="M 45 10 L 45 35 L 755 35 L 755 10" 
        fill="none" stroke="#e6edf3" stroke-width="2" stroke-linecap="square" />

  <!-- Corner Crosses -->
  <path d="M 42 35 L 48 35 M 45 32 L 45 38" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
  <path d="M 752 35 L 758 35 M 755 32 L 755 38" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
</svg>
