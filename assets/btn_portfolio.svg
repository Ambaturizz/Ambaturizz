<svg xmlns="http://www.w3.org/2000/svg" width="160" height="32" viewBox="0 0 160 32">
  <style>
    .btn-bracket {
      fill: #38bdf8;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .btn-text {
      fill: #f0f6fc;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    svg:hover .btn-bracket {
      fill: #00f5ff;
      filter: drop-shadow(0 0 4px rgba(0, 245, 255, 0.8));
    }
    svg:hover .btn-text {
      fill: #38bdf8;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.9));
    }
  </style>
  <text x="80" y="22" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Courier New', monospace" font-size="16" letter-spacing="1.5">
    <tspan class="btn-bracket">[ </tspan>
    <tspan class="btn-text">Portfolio</tspan>
    <tspan class="btn-bracket"> ]</tspan>
  </text>
</svg>
